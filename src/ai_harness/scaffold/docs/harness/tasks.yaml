# 任务路由表 —— 冷启动只读清单（禁止先全库探索）
# AI：先 `make context-pack TASK=<id> DOMAIN=<域>`，只读输出中的文件，再动手。
# 检查：scripts/kb_sync.py check（含 Brief/ADR 抢跑闸）/ check-ship（合入 Accept PASS）
#
# 产品流水线字段（可选）：
#   require_brief_approved: [docs/features/<id>/brief.md]  — 未 approved 禁 codeish
#   require_adr_accepted: [docs/decisions/ADR-….md]         — 仍「提议中」禁 codeish
#   require_accept_pass: true                              — 合入须 accept.md PASS
#   brief_exempt: true                                     — 不要求 handoff.feature（微改/历史 playbook）
# 默认豁免 task：define-feature / accept-feature / maintain-knowledge / harness-feedback /
#   resume / troubleshoot / l1-micro（见 kb_sync.BRIEF_EXEMPT_TASKS）
version: 1

tasks:
  resume:
    summary: 跨会话续作（先读 handoff）
    playbook: docs/playbooks/continue-handoff.md
    must_read:
      - docs/harness/handoff.md
      - docs/playbooks/continue-handoff.md
      - docs/harness/tasks.yaml
      - docs/harness/domains.yaml

  maintain-knowledge:
    summary: 知识库/注册表维护
    playbook: docs/playbooks/maintain-knowledge.md
    must_read:
      - docs/playbooks/maintain-knowledge.md
      - docs/harness/domains.yaml
      - docs/harness/tasks.yaml
      - AGENTS.md

  harness-feedback:
    summary: agent 踩坑后加固 harness
    playbook: docs/playbooks/harness-feedback.md
    must_read:
      - docs/playbooks/harness-feedback.md
      - docs/harness/invariants.md
      - AGENTS.md

  define-feature:
    summary: 写 Feature Brief（Define；不写业务代码）
    playbook: docs/playbooks/define-feature.md
    must_read:
      - docs/playbooks/define-feature.md
      - docs/features/_TEMPLATE/brief.md
      - docs/harness/invariants.md
      - AGENTS.md

  accept-feature:
    summary: 对照 Brief AC 验收（Accept；不改产品代码）
    playbook: docs/playbooks/accept-feature.md
    must_read:
      - docs/playbooks/accept-feature.md
      - docs/features/_TEMPLATE/accept.md
      - docs/harness/invariants.md
      - AGENTS.md

  example-add-feature:
    summary: 示例业务任务（请改成真实任务）
    playbook: docs/playbooks/example-add-feature.md
    require_domain: true
    brief_exempt: true  # 脚手架示例；真实新功能勿豁免，用 require_brief_approved + feature
    # require_adr_accepted:
    #   - docs/decisions/ADR-XXX.md
    # require_brief_approved:
    #   - docs/features/example/brief.md
    must_read:
      - docs/harness/domains.yaml
      - docs/architecture.md
      - docs/playbooks/example-add-feature.md

  l1-micro:
    summary: 单点微改（已知道文件）
    playbook: ""
    require_domain: true
    must_read:
      - docs/harness/domains.yaml
